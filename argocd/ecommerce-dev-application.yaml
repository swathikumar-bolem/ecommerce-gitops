apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-dev
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
    - RespectIgnoreDifferences=true
  source:
    repoURL: https://github.com/swathikumar-bolem/ecommerce-gitops.git
    targetRevision: main
    path: environments/dev
