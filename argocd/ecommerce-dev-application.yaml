# Intentionally manual Sync: no syncPolicy.automated yet.
# Edit repoURL if you name your GitOps repository differently.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/swathikumar-bolem/ecommerce-gitops.git
    targetRevision: main
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
