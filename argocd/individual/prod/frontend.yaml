apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-prod-frontend
  namespace: argocd
  labels:
    lab.env: prod
    lab.service: frontend
spec:
  project: default
  source:
    repoURL: https://github.com/swathikumar-bolem/ecommerce-gitops.git
    targetRevision: main
    path: charts/ecommerce-workload
    helm:
      releaseName: frontend
      valueFiles:
      - values/base/frontend.yaml
      - values/prod/frontend.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-prod
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
    - FailOnSharedResource=true
    - RespectIgnoreDifferences=true
    - CreateNamespace=false
