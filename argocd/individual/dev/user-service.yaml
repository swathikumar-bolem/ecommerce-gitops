apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-dev-user-service
  namespace: argocd
  labels:
    lab.env: dev
    lab.service: user-service
spec:
  project: default
  source:
    repoURL: https://github.com/swathikumar-bolem/ecommerce-gitops.git
    targetRevision: main
    path: charts/ecommerce-workload
    helm:
      releaseName: user-service
      valueFiles:
      - values/base/user-service.yaml
      - values/dev/user-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
    - FailOnSharedResource=true
    - RespectIgnoreDifferences=true
    - CreateNamespace=false

