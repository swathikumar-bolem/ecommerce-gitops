apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-dev-order-service
  namespace: argocd
  labels:
    lab.env: dev
    lab.service: order-service
spec:
  project: default
  source:
    repoURL: https://github.com/swathikumar-bolem/ecommerce-gitops.git
    targetRevision: main
    path: charts/ecommerce-workload
    helm:
      releaseName: order-service
      valueFiles:
      - values/base/order-service.yaml
      - values/dev/order-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
    - FailOnSharedResource=true
    - RespectIgnoreDifferences=true
    - CreateNamespace=false
