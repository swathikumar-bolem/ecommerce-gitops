image:
  reference: kumarbolem/ecommerce-frontend:1.1.0
replicaCount: 3
autoscaling:
  enabled: false
resources:
  deployment:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
      annotations:
        argocd.argoproj.io/sync-wave: '1'
      namespace: ecommerce
    spec:
      replicas: 3
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      selector:
        matchLabels:
          app: frontend
      template:
        metadata:
          labels:
            app: frontend
          annotations:
            lab.gitops/release: v2
        spec:
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: frontend
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: frontend
          containers:
          - name: frontend
            image: kumarbolem/ecommerce-frontend:1.1.0
            imagePullPolicy: IfNotPresent
            ports:
            - name: http
              containerPort: 80
            resources:
              requests:
                cpu: 30m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            startupProbe:
              httpGet:
                path: /
                port: http
              periodSeconds: 5
              failureThreshold: 24
            readinessProbe:
              httpGet:
                path: /
                port: http
              periodSeconds: 5
            livenessProbe:
              httpGet:
                path: /
                port: http
              periodSeconds: 10
  service:
    apiVersion: v1
    kind: Service
    metadata:
      name: frontend
      annotations:
        argocd.argoproj.io/sync-wave: '0'
      namespace: ecommerce
    spec:
      type: ClusterIP
      selector:
        app: frontend
      ports:
      - name: http
        port: 80
        targetPort: http
  hpa: null
  pdb:
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: frontend-pdb
      namespace: ecommerce
    spec:
      minAvailable: 2
      unhealthyPodEvictionPolicy: AlwaysAllow
      selector:
        matchLabels:
          app: frontend
