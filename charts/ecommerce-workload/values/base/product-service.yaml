image:
  reference: kumarbolem/product-service:1.0.0
replicaCount: 1
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
resources:
  deployment:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: product-service
      annotations:
        argocd.argoproj.io/sync-wave: '0'
      namespace: ecommerce
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: product-service
      template:
        metadata:
          labels:
            app: product-service
        spec:
          containers:
          - name: product-service
            image: kumarbolem/product-service:1.0.0
            imagePullPolicy: IfNotPresent
            ports:
            - name: http
              containerPort: 8082
            env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/productdb
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-db
                  key: DB_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 300Mi
              limits:
                cpu: 750m
                memory: 700Mi
            startupProbe:
              httpGet:
                path: /actuator/health/liveness
                port: http
              periodSeconds: 5
              failureThreshold: 60
              timeoutSeconds: 2
            readinessProbe:
              httpGet:
                path: /actuator/health/readiness
                port: http
              periodSeconds: 5
              failureThreshold: 5
              timeoutSeconds: 2
            livenessProbe:
              httpGet:
                path: /actuator/health/liveness
                port: http
              periodSeconds: 10
              failureThreshold: 3
              timeoutSeconds: 2
  service:
    apiVersion: v1
    kind: Service
    metadata:
      name: product-service
      annotations:
        argocd.argoproj.io/sync-wave: '-1'
      namespace: ecommerce
    spec:
      type: ClusterIP
      selector:
        app: product-service
      ports:
      - name: http
        port: 8082
        targetPort: http
  hpa:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: product-service
      namespace: ecommerce
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: product-service
      minReplicas: 2
      maxReplicas: 4
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 60
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
  pdb: null
