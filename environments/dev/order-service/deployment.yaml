apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: kumarbolem/order-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8084
        env:
        - name: DB_URL
          value: jdbc:postgresql://postgres:5432/orderdb
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-db
              key: DB_PASSWORD
        - name: USER_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: USER_URL
        - name: PRODUCT_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PRODUCT_URL
        - name: INVENTORY_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: INVENTORY_URL
        - name: PAYMENT_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PAYMENT_URL
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
          limits:
            cpu: 750m
            memory: 700Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          failureThreshold: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 2
