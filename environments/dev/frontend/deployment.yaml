apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  namespace: ecommerce
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
     labels:
      app: frontend
     annotations:
      lab.gitops/release: "v2"
    spec:
      containers:
      - name: frontend
        image: kumarbolem/ecommerce-frontend:lab06-nonexistent-tag
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 30m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
